<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы — Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --income: #3fb950;
            --expense: #f85149;
            --modal-bg: #161b22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 16px 90px 16px;
            overflow-x: hidden;
        }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.15) 0%, rgba(163, 113, 247, 0.15) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 18px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .stat-icon.inc { background: rgba(63, 185, 80, 0.15); color: var(--income); }
        .stat-icon.exp { background: rgba(248, 81, 73, 0.15); color: var(--expense); }

        .stat-info span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat-info strong {
            font-size: 15px;
            font-weight: 600;
        }

        /* Блок аналитики */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
        }

        .toggle-pills {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 3px;
        }

        .pill-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill-btn.active {
            background: var(--card-border);
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-chart {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        /* История операций */
        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tx-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.15s;
        }

        .tx-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tx-emoji {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .tx-details h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .tx-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tx-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 600;
        }

        .tx-amount.income { color: var(--income); }
        .tx-amount.expense { color: var(--expense); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            padding: 4px;
            cursor: pointer;
            opacity: 0.6;
        }

        /* Кнопка добавления */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #2f81f7, #8957e5);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 24px rgba(47, 129, 247, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 90;
        }

        .fab:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* Модальное окно (Bottom Sheet) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 100;
            display: flex;
            align-items: flex-end;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            background: var(--modal-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 26px 26px 0 0;
            width: 100%;
            padding: 20px 20px 32px 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .modal-overlay.open .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 18px auto;
        }

        .type-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 18px;
        }

        .type-btn {
            border: none;
            background: none;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .type-btn.active.expense {
            background: rgba(248, 81, 73, 0.2);
            color: var(--expense);
        }

        .type-btn.active.income {
            background: rgba(63, 185, 80, 0.2);
            color: var(--income);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .amount-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            outline: none;
        }

        .amount-input:focus {
            border-color: var(--accent);
        }

        .note-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .cat-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
        }

        .cat-chip.selected {
            background: rgba(88, 166, 255, 0.18);
            border-color: var(--accent);
        }

        .cat-chip span {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .cat-chip p {
            font-size: 11px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: #0d1117;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Карточка баланса -->
    <div class="balance-card">
        <div class="balance-title">Общий баланс</div>
        <div class="balance-amount" id="totalBalance">0 ₽</div>
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-icon inc">↓</div>
                <div class="stat-info">
                    <span>Поступления</span>
                    <strong id="totalIncome">0 ₽</strong>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon exp">↑</div>
                <div class="stat-info">
                    <span>Траты</span>
                    <strong id="totalExpense">0 ₽</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- График по категориям -->
    <div class="section-card">
        <div class="section-header">
            <div class="section-title">Аналитика</div>
            <div class="toggle-pills">
                <button class="pill-btn active" onclick="setChartType('expense', this)">Траты</button>
                <button class="pill-btn" onclick="setChartType('income', this)">Доходы</button>
            </div>
        </div>
        <div class="chart-container" id="chartWrapper">
            <canvas id="financeChart"></canvas>
            <div class="empty-chart" id="emptyChartMsg" style="display: none;">Нет данных за выбранный тип</div>
        </div>
    </div>

    <!-- История -->
    <div class="section-header">
        <div class="section-title">История операций</div>
        <div class="toggle-pills">
            <button class="pill-btn active" onclick="setHistoryFilter('all', this)">Все</button>
            <button class="pill-btn" onclick="setHistoryFilter('expense', this)">Траты</button>
            <button class="pill-btn" onclick="setHistoryFilter('income', this)">Доходы</button>
        </div>
    </div>
    <div class="tx-list" id="txList"></div>

    <!-- Плавающая кнопка -->
    <button class="fab" onclick="openModal()">
        <span>+</span> Добавить операцию
    </button>

    <!-- Выезжающее меню добавления -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>
            
            <div class="type-switch">
                <button class="type-btn active expense" id="btnTypeExpense" onclick="switchTxType('expense')">Трата</button>
                <button class="type-btn income" id="btnTypeIncome" onclick="switchTxType('income')">Поступление</button>
            </div>

            <div class="input-group">
                <label>Сумма (₽)</label>
                <input type="number" id="amountInput" class="amount-input" placeholder="0" inputmode="decimal">
            </div>

            <div class="input-group">
                <label>Категория</label>
                <div class="categories-grid" id="categoriesGrid"></div>
            </div>

            <div class="input-group">
                <label>Комментарий (необязательно)</label>
                <input type="text" id="noteInput" class="note-input" placeholder="Например: Пятёрочка или аванс">
            </div>

            <button class="submit-btn" onclick="saveTransaction()">Сохранить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0d1117');
            tg.setBackgroundColor('#0d1117');
        }

        const CATEGORIES = {
            expense: [
                { id: 'food', name: 'Продукты', emoji: '🛒', color: '#f85149' },
                { id: 'clothes', name: 'Одежда', emoji: '👕', color: '#a371f7' },
                { id: 'transport', name: 'Транспорт', emoji: '🚕', color: '#58a6ff' },
                { id: 'cafe', name: 'Кафе', emoji: '☕', color: '#d29922' },
                { id: 'home', name: 'Дом и ЖКХ', emoji: '🏠', color: '#3fb950' },
                { id: 'other_exp', name: 'Другое', emoji: '📦', color: '#8b949e' }
            ],
            income: [
                { id: 'salary', name: 'Зарплата', emoji: '💼', color: '#3fb950' },
                { id: 'debt', name: 'Вернули долг', emoji: '🤝', color: '#58a6ff' },
                { id: 'gift', name: 'Подарок', emoji: '🎁', color: '#a371f7' },
                { id: 'freelance', name: 'Подработка', emoji: '💻', color: '#d29922' },
                { id: 'cashback', name: 'Кэшбэк', emoji: '💳', color: '#39c5cf' },
                { id: 'other_inc', name: 'Другое', emoji: '💰', color: '#8b949e' }
            ]
        };

        let transactions = JSON.parse(localStorage.getItem('tg_fin_tx')) || [
            { id: 1, type: 'income', category: 'salary', amount: 85000, note: 'Основная зарплата', date: 'Сегодня' },
            { id: 2, type: 'expense', category: 'food', amount: 3450, note: 'Продукты на неделю', date: 'Сегодня' },
            { id: 3, type: 'expense', category: 'clothes', amount: 6200, note: 'Кроссовки', date: 'Вчера' },
            { id: 4, type: 'income', category: 'debt', amount: 5000, note: 'Алексей вернул', date: 'Вчера' }
        ];

        let currentTxType = 'expense';
        let selectedCategory = CATEGORIES.expense[0].id;
        let chartType = 'expense';
        let historyFilter = 'all';
        let chartInstance = null;

        function haptic(type = 'light') {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(type);
            }
        }

        function formatMoney(num) {
            return num.toLocaleString('ru-RU') + ' ₽';
        }

        function renderApp() {
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            const balance = income - expense;

            document.getElementById('totalBalance').textContent = formatMoney(balance);
            document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
            document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);

            renderChart();
            renderHistory();
        }

        function renderChart() {
            const filtered = transactions.filter(t => t.type === chartType);
            const canvas = document.getElementById('financeChart');
            const emptyMsg = document.getElementById('emptyChartMsg');

            if (filtered.length === 0) {
                canvas.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }

            canvas.style.display = 'block';
            emptyMsg.style.display = 'none';

            const grouped = {};
            filtered.forEach(t => {
                grouped[t.category] = (grouped[t.category] || 0) + t.amount;
            });

            const labels = [];
            const data = [];
            const colors = [];

            Object.keys(grouped).forEach(catId => {
                const catInfo = CATEGORIES[chartType].find(c => c.id === catId) || { name: 'Другое', color: '#8b949e' };
                labels.push(catInfo.name);
                data.push(grouped[catId]);
                colors.push(catInfo.color);
            });

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(canvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#f0f6fc',
                                font: { size: 12 },
                                boxWidth: 12,
                                padding: 14
                            }
                        }
                    }
                }
            });
        }

        function renderHistory() {
            const listEl = document.getElementById('txList');
            listEl.innerHTML = '';

            const filtered = transactions.filter(t => historyFilter === 'all' || t.type === historyFilter);

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-chart" style="padding: 20px;">Операций пока нет</div>';
                return;
            }

            filtered.forEach(tx => {
